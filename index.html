<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Temperaturas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 500px;
            margin: 40px auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="number"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #2980b9;
        }

        #resultado {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            background-color: #e8f8f5;
            border: 1px solid #a3e4d7;
            color: #117a65;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Conversor de temperaturas</h1>

        <div class="form-group">
            <label for="temperatura">Temperatura:</label>
            <input type="number" id="temperatura" step="any" placeholder="Ingresa un valor numérico">
        </div>

        <div class="form-group">
            <label for="tipoConversion">Tipo de conversión:</label>
            <select id="tipoConversion">
                <option value="cToF">Celsius a Fahrenheit</option>
                <option value="fToC">Fahrenheit a Celsius</option>
            </select>
        </div>

        <button id="btnConvertir">Convertir</button>

        <div id="resultado"></div>
    </div>

    <script src="temperaturas.js"></script>
</body>
</html>
